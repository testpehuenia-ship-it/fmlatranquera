<!DOCTYPE html>
<html class="light" lang="es">
<head>
    <meta charset="utf-8"/>
    <meta content="width=device-width, initial-scale=1.0" name="viewport"/>
    <title>Admin - FM La Tranquera</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Domine:wght@400;600;700&family=Source+Sans+3:wght@400;600;700&display=swap" rel="stylesheet"/>
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet"/>
    <script id="tailwind-config">

            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface": "#fdf9f4",
                        "background": "#fdf9f4",
                        "on-error": "#ffffff",
                        "surface-bright": "#fdf9f4",
                        "primary": "#442a22",
                        "on-primary": "#ffffff",
                        "on-error-container": "#93000a",
                        "secondary-container": "#fed39f",

                        "surface-variant": "#e6e2dd",
                        "error-container": "#ffdad6",
                        "on-surface": "#1c1c19",
                        "on-secondary-fixed": "#2a1700",
                        "error": "#ba1a1a",
                        "surface-container-low": "#f7f3ee",
                        "surface-container-high": "#ebe8e3",
                        "tertiary": "#1e3623",
                        "secondary": "#78582f",
                        "tertiary-fixed": "#cdeace",
                        "primary-fixed-dim": "#e7bdb1",
                        "surface-tint": "#77574d",
                        "on-tertiary": "#ffffff",
                        "inverse-on-surface": "#f4f0eb",
                        "surface-container-highest": "#e6e2dd",
                        "on-secondary": "#ffffff",
                        "on-tertiary-fixed-variant": "#344c38",
                        "tertiary-fixed-dim": "#b2ceb3",
                        "outline-variant": "#d4c3be",
                        "primary-fixed": "#ffdbd0",
                        "surface-container": "#f1ede8",
                        "on-primary-fixed-variant": "#5d4037",
                        "on-tertiary-fixed": "#08200f",
                        "surface-dim": "#ddd9d5",
                        "on-secondary-container": "#795930",
                        "on-surface-variant": "#504441",
                        "on-primary-container": "#d4ada1",
                        "on-primary-fixed": "#2c160e",
                        "secondary-fixed": "#ffddb7",
                        "surface-container-lowest": "#ffffff",
                        "inverse-primary": "#e7bdb1",
                        "secondary-fixed-dim": "#eabf8d",
                        "on-tertiary-container": "#a1bda3",
                        "on-secondary-fixed-variant": "#5e411a",
                        "on-background": "#1c1c19",
                        "inverse-surface": "#31302d",
                        "primary-container": "#5d4037",
                        "outline": "#827470"
                    },
                    "borderRadius": {

                    "spacing": {

                    "fontFamily": {

                        "body-md": ["'Source Sans 3'"],

                        "display-lg": ["Domine"]
                    },
                    "fontSize": {
                        "headline-md": ["24px", {"lineHeight": "32px", "fontWeight": "600"}],
                        "body-md": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "body-lg": ["18px", {"lineHeight": "28px", "fontWeight": "400"}],
                        "label-sm": ["14px", {"lineHeight": "20px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                        "display-lg-mobile": ["32px", {"lineHeight": "40px", "fontWeight": "700"}],
                        "display-lg": ["48px", {"lineHeight": "56px", "letterSpacing": "-0.02em", "fontWeight": "700"}]
                    }
                },
            },
        }
    </script>
    <style>
        body {
            background-color: #fdf9f4;
            color: #1c1c19;
            font-family: 'Source Sans 3', sans-serif;
            overflow-x: hidden;
        }
        .rustic-border {
            border: 1px solid #d4c3be;
        }
    </style>
</head>
<body class="bg-surface selection:bg-secondary-container selection:text-on-secondary-container">
    <header class="bg-surface border-b border-outline-variant py-4">
        <div class="max-w-container-max mx-auto px-margin-desktop flex justify-between items-center">
            <h1 class="font-display-lg-mobile text-primary">Panel de Administración</h1>
            <a href="/" class="text-secondary font-bold hover:underline">Volver al sitio</a>
        </div>
    </header>
    <section class="max-w-container-max mx-auto px-margin-desktop py-10 border-b border-outline-variant">
        <div class="flex flex-col md:flex-row justify-between items-start md:items-end mb-6 gap-4">
            <h2 class="font-headline-md text-primary">Mensajes y Pedidos Recibidos</h2>
            <div class="flex flex-wrap gap-4 items-end">
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Desde</label>
                    <input type="date" id="filter-start" class="bg-surface border-outline-variant rounded p-1 text-sm focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Hasta</label>
                    <input type="date" id="filter-end" class="bg-surface border-outline-variant rounded p-1 text-sm focus:ring-secondary focus:border-secondary">
                </div>
                <button onclick="fetchMessages()" class="bg-secondary text-white font-label-sm px-4 py-2 rounded hover:bg-primary transition-all">FILTRAR</button>
                <button onclick="deleteMessages()" class="bg-error text-on-error font-label-sm px-4 py-2 rounded hover:bg-red-800 transition-all flex items-center gap-1">
                    <span class="material-symbols-outlined text-sm">delete</span> ELIMINAR
                </button>
            </div>
        </div>
        <div id="messages-list" class="grid grid-cols-1 gap-2 max-h-[500px] overflow-y-auto">
            <!-- Javascript will populate this -->
        </div>
    </section>
    <main class="max-w-container-max mx-auto px-margin-desktop py-10 grid grid-cols-1 lg:grid-cols-2 gap-10">
        <!-- Formulario -->
        <div>
            <h2 class="font-headline-md mb-6 text-primary">Agregar Nueva Noticia</h2>
            <form id="news-form" class="bg-surface-container-low p-6 rounded-lg rustic-border space-y-4 mb-10">
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Título</label>
                    <input type="text" name="title" required class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Resumen</label>
                    <textarea name="excerpt" required rows="4" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary"></textarea>
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Fecha</label>
                    <input type="text" name="date" placeholder="Ej: 12 OCTUBRE, 2024" required class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Imagen (Archivo)</label>
                    <input type="file" name="image" accept="image/*" class="w-full text-sm">
                </div>
                <div class="flex items-center gap-2 pt-2">
                    <input type="checkbox" name="is_main" id="is_main" class="rounded text-secondary focus:ring-secondary">
                    <label for="is_main" class="font-label-sm text-on-surface-variant">Destacar como noticia principal</label>
                </div>
                <input type="hidden" name="news_id" id="news_id">
                <button type="submit" id="btn-submit-news" class="w-full bg-secondary text-white font-label-sm py-3 rounded mt-4 hover:bg-primary transition-all"><span id="news-form-btn-text">PUBLICAR NOTICIA</span></button>
            </form>

            <h2 class="font-headline-md mb-6 text-primary">Configuración General</h2>
            <form id="settings-form" class="bg-surface-container-low p-6 rounded-lg rustic-border space-y-4">
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Localidad para el pronóstico</label>
                    <input type="text" name="weather_location" id="weather_location" placeholder="Ej: Villa Pehuenia, Neuquen" required class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                    <p class="text-xs text-on-surface-variant mt-1">Escribe la ciudad y provincia para obtener los datos más precisos.</p>
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">URL del Streaming de Radio</label>
                    <input type="url" name="stream_url" id="stream_url" placeholder="Ej: https://stream.radio.com/audio" required class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">URL del RSS (Noticias)</label>
                    <input type="url" name="rss_url" id="rss_url" placeholder="Ej: https://www.clarin.com/rss/lo-ultimo/" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">URL del RSS (Eventos Automáticos)</label>
                    <input type="url" name="events_rss_url" id="events_rss_url" placeholder="Ej: https://misitio.com/eventos/rss" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Hora de actualización (0-23)</label>
                    <input type="time" name="rss_time" id="rss_time" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div class="flex gap-4 mt-4">
                    <button type="submit" class="flex-1 bg-secondary text-white font-label-sm py-3 rounded hover:bg-primary transition-all">GUARDAR CONFIGURACIÓN</button>
                    <button type="button" onclick="forceRssUpdate()" class="flex-1 bg-tertiary text-on-tertiary font-label-sm py-3 rounded hover:bg-primary transition-all">FORZAR ACTUALIZACIÓN RSS</button>
                </div>
            </form>


        </div>
        <!-- Lista de noticias -->
        <div>
            <h2 class="font-headline-md mb-6 text-primary">Noticias Publicadas</h2>
            <div id="news-list" class="space-y-4 mb-10">
                <!-- Javascript will populate this -->
            </div>

            <h2 class="font-headline-md mb-6 text-primary">Próximos Eventos</h2>
            <div id="events-list" class="space-y-4">
                <!-- Javascript will populate this -->
            </div>
            
            <h2 class="font-headline-md mb-6 text-primary mt-10">Agregar Evento Manual (Máx 3)</h2>
            <form id="events-form" class="bg-surface-container-low p-6 rounded-lg rustic-border space-y-4">
                <div class="grid grid-cols-2 gap-4">
                    <div>
                        <label class="block font-label-sm mb-1 text-on-surface-variant">Día</label>
                        <input type="number" name="day" required min="1" max="31" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                    </div>
                    <div>
                        <label class="block font-label-sm mb-1 text-on-surface-variant">Mes</label>
                        <input type="text" name="month" required maxlength="3" placeholder="OCT" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary uppercase">
                    </div>
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Título</label>
                    <input type="text" name="title" required maxlength="50" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <div>
                    <label class="block font-label-sm mb-1 text-on-surface-variant">Ubicación / Descripción Corta</label>
                    <input type="text" name="location" required maxlength="60" placeholder="Máx 60 caracteres" class="w-full bg-surface border-outline-variant rounded p-2 focus:ring-secondary focus:border-secondary">
                </div>
                <button type="submit" id="btn-add-event" class="w-full bg-secondary text-white font-label-sm py-3 rounded mt-4 hover:bg-primary transition-all">AGREGAR EVENTO</button>
            </form>
        </div>
    </main>
    <section class="max-w-container-max mx-auto px-margin-desktop py-10 border-t border-outline-variant">
        <h2 class="font-headline-md text-primary mb-6">Gestión de Publicidad (Banners)</h2>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6" id="ads-container">
            <!-- Rendered by JS -->
        </div>
    </section>
    <script>
        const adDimensions = {
            1: "1090x200 px (Entre reproductor y grilla)",
            2: "1090x200 px (Debajo de la grilla)",
            3: "738x200 px (Arriba de Noticias)",
            4: "300x300 px (Entre Clima y Granos)",
            5: "300x300 px (Entre Granos y Eventos)",
            6: "300x300 px (Debajo de Eventos)"
        };

        async function fetchAds() {
            const res = await fetch('/api/ads');
            const data = await res.json();
            const adsMap = {};
            if (data.data) {
                data.data.forEach(ad => {
                    adsMap[ad.slot] = ad;
                });
            }

            const container = document.getElementById('ads-container');
            container.innerHTML = '';
            for(let i = 1; i <= 6; i++) {
                const ad = adsMap[i];
                let adHtml = '';
                if (ad) {
                    const isVideo = ad.image_url && ad.image_url.match(/\.(mp4|webm|ogg)$/i);
                    const mediaHtml = isVideo
                        ? `<video src="${ad.image_url}" class="max-w-full max-h-full object-contain" autoplay loop muted playsinline></video>`
                        : `<img src="${ad.image_url}" class="max-w-full max-h-full object-contain">`;
                        
                    adHtml = `
                        <div class="relative w-full h-32 mb-4 bg-surface-dim rounded overflow-hidden flex items-center justify-center">
                            ${mediaHtml}
                        </div>
                        <button type="button" onclick="deleteAd(${i})" class="w-full bg-error text-on-error font-label-sm py-2 rounded mb-2 hover:bg-red-800 transition-all flex items-center justify-center gap-1">
                            <span class="material-symbols-outlined text-sm">delete</span> ELIMINAR BANNER
                        </button>
                    `;
                } else {
                    adHtml = `
                        <div class="flex-grow flex items-center justify-center border-2 border-dashed border-outline-variant rounded mb-4 h-32 text-on-surface-variant text-sm">
                            Vacío
                        </div>
                    `;
                }
                
                container.innerHTML += `
                    <div class="bg-surface-container-low p-4 rounded-lg rustic-border flex flex-col h-full">
                        <h3 class="font-label-sm font-bold text-primary mb-1">Slot ${i}</h3>
                        <p class="text-xs text-on-surface-variant mb-4">${adDimensions[i]}</p>
                        ${adHtml}
                        <form onsubmit="uploadAd(event, ${i})" class="mt-auto flex flex-col gap-2">
                            <input type="url" name="link_url" placeholder="URL destino (opcional)" value="${ad ? ad.link_url : ''}" class="w-full bg-surface border-outline-variant rounded p-2 text-xs focus:ring-secondary focus:border-secondary">
                            <input type="file" name="image" accept="image/*,image/gif,video/mp4,image/webp" required class="w-full text-xs">
                            <button type="submit" class="w-full bg-secondary text-white font-label-sm py-2 rounded hover:bg-primary transition-all">SUBIR BANNER</button>
                        </form>
                    </div>
                `;
            }
        }

        async function uploadAd(e, slot) {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            btn.innerText = 'SUBIENDO...';
            btn.disabled = true;

            const formData = new FormData(e.target);
            formData.append('slot', slot);

            try {
                const res = await fetch('/api/ads', { method: 'POST', body: formData });
                if(res.ok) {
                    fetchAds();
                } else {
                    alert('Error subiendo banner');
                    btn.innerText = originalText;
                    btn.disabled = false;
                }
            } catch (err) {
                console.error(err);
                alert('Error de conexión');
                btn.innerText = originalText;
                btn.disabled = false;
            }
        }

        async function deleteAd(slot) {
            if(!confirm('¿Eliminar banner?')) return;
            try {
                await fetch('/api/ads/' + slot, { method: 'DELETE' });
                fetchAds();
            } catch (err) {
                console.error(err);
            }
        }

        async function fetchNews() {
            const res = await fetch('/api/news');
            const data = await res.json();
            const list = document.getElementById('news-list');
            const btnSubmit = document.getElementById('btn-submit-news');
            const btnText = document.getElementById('news-form-btn-text');
            list.innerHTML = '';
            
            if (data.data.length === 0) {
                list.innerHTML = '<p class="text-on-surface-variant">No hay noticias publicadas.</p>';
            }

            if (data.data.length >= 3) {
                btnSubmit.disabled = true;
                btnText.innerText = 'LÍMITE ALCANZADO (3 MÁX)';
                btnSubmit.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btnSubmit.disabled = false;
                btnText.innerText = document.getElementById('news_id') && document.getElementById('news_id').value ? 'ACTUALIZAR NOTICIA' : 'PUBLICAR NOTICIA';
                btnSubmit.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            data.data.forEach(item => {
                const itemJson = JSON.stringify(item).replace(/"/g, '&quot;');
                const div = document.createElement('div');
                div.className = 'bg-surface-container-low p-4 rounded-lg rustic-border flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex gap-4 items-center">
                        ${item.image_url ? `<img src="${item.image_url}" class="w-16 h-16 object-cover rounded">` : ''}
                        <div>
                            <p class="font-label-sm text-secondary">${item.date}</p>
                            <h3 class="font-bold text-lg">${item.title} ${item.is_main ? '⭐' : ''} ${item.is_auto ? '<span class="text-[10px] bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-full ml-2 align-middle">🤖 Auto</span>' : ''}</h3>
                        </div>
                    </div>
                    <div class="flex gap-2">
                        <button onclick="setMainNews(${item.id})" class="${item.is_main ? 'text-yellow-600 bg-yellow-100' : 'text-on-surface-variant bg-surface-variant hover:text-yellow-600 hover:bg-yellow-100'} p-2 rounded material-symbols-outlined transition-colors" title="Marcar como Noticia Principal">star</button>
                        <button onclick="editNews('${itemJson}')" class="text-secondary hover:text-primary bg-secondary-container p-2 rounded material-symbols-outlined transition-colors">edit</button>
                        <button onclick="deleteNews(${item.id})" class="text-error hover:text-red-700 bg-error-container p-2 rounded material-symbols-outlined transition-colors">delete</button>
                    </div>
                `;
                list.appendChild(div);
            });
        }

        function editNews(itemJson) {
            const item = JSON.parse(itemJson);
            const form = document.getElementById('news-form');
            form.elements['news_id'].value = item.id;
            form.elements['title'].value = item.title;
            form.elements['excerpt'].value = item.excerpt;
            form.elements['date'].value = item.date;
            form.elements['is_main'].checked = item.is_main;
            document.getElementById('news-form-btn-text').innerText = 'ACTUALIZAR NOTICIA';
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        async function deleteNews(id) {
            if(confirm('¿Seguro que deseas eliminar esta noticia?')) {
                await fetch('/api/news/' + id, { method: 'DELETE' });
                fetchNews();
            }
        }
        
        async function setMainNews(id) {
            try {
                await fetch('/api/news/' + id + '/main', { method: 'PATCH' });
                fetchNews();
            } catch (err) {
                console.error(err);
            }
        }

        document.getElementById('news-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            formData.set('is_main', formData.get('is_main') ? '1' : '0');

            const newsId = formData.get('news_id');
            let url = '/api/news';
            let method = 'POST';
            
            if (newsId) {
                url = '/api/news/' + newsId;
                method = 'PUT';
            }

            const res = await fetch(url, {
                method: method,
                body: formData
            });

            if (res.ok) {
                e.target.reset();
                e.target.elements['news_id'].value = '';
                document.getElementById('news-form-btn-text').innerText = 'PUBLICAR NOTICIA';
                fetchNews();
                alert(newsId ? 'Noticia actualizada exitosamente' : 'Noticia publicada exitosamente');
            } else {
                alert('Error al guardar la noticia');
            }
        });

        async function fetchSettings() {
            const res = await fetch('/api/settings');
            const data = await res.json();
            if (data.data.weather_location) {
                document.getElementById('weather_location').value = data.data.weather_location;
            }
            if (data.data.stream_url) {
                document.getElementById('stream_url').value = data.data.stream_url;
            }
            if (data.data.rss_url) {
                document.getElementById('rss_url').value = data.data.rss_url;
            }
            if (data.data.rss_time) {
                const el = document.getElementById('rss_time');
                if(el) el.value = data.data.rss_time;
            }
            if (data.data.events_rss_url) {
                const el = document.getElementById('events_rss_url');
                if(el) el.value = data.data.events_rss_url;
            }
        }

        document.getElementById('settings-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const location = document.getElementById('weather_location').value;
            const streamUrl = document.getElementById('stream_url').value;
            const rssUrl = document.getElementById('rss_url') ? document.getElementById('rss_url').value : '';
            const rssTime = document.getElementById('rss_time') ? document.getElementById('rss_time').value : '';
            const eventsRssUrl = document.getElementById('events_rss_url') ? document.getElementById('events_rss_url').value : '';
            
            const reqs = [
                fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'weather_location', value: location }) }),
                fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'stream_url', value: streamUrl }) }),
                fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'rss_url', value: rssUrl }) }),
                fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'rss_time', value: rssTime }) }),
                fetch('/api/settings', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ key: 'events_rss_url', value: eventsRssUrl }) })
            ];
            
            await Promise.all(reqs);
            alert('Configuración guardada exitosamente');
        });

        async function fetchEvents() {
            const res = await fetch('/api/events');
            const data = await res.json();
            const list = document.getElementById('events-list');
            const btn = document.getElementById('btn-add-event');
            list.innerHTML = '';
            
            if (data.data.length === 0) {
                list.innerHTML = '<p class="text-on-surface-variant">No hay eventos publicados.</p>';
            }
            
            if (data.data.length >= 3) {
                btn.disabled = true;
                btn.innerText = 'LÍMITE ALCANZADO (3 MÁX)';
                btn.classList.add('opacity-50', 'cursor-not-allowed');
            } else {
                btn.disabled = false;
                btn.innerText = 'AGREGAR EVENTO';
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
            }

            data.data.forEach(item => {
                const div = document.createElement('div');
                div.className = 'bg-surface-container-low p-4 rounded-lg rustic-border flex justify-between items-center';
                div.innerHTML = `
                    <div class="flex gap-4 items-center">
                        <div class="bg-primary text-white p-2 rounded text-center min-w-[3.5rem]">
                            <p class="font-bold text-xl leading-none">${item.day}</p>
                            <p class="text-[10px] uppercase">${item.month}</p>
                        </div>
                        <div>
                            <h3 class="font-bold text-lg text-primary">${item.title} ${item.is_auto ? '<span class="text-[10px] bg-secondary-container text-on-secondary-container px-2 py-0.5 rounded-full ml-2 align-middle">🤖 Auto</span>' : ''}</h3>
                            <p class="font-label-sm text-secondary">${item.location}</p>
                        </div>
                    </div>
                    <button onclick="deleteEvent(${item.id})" class="text-error hover:text-red-700 bg-error-container p-2 rounded material-symbols-outlined">delete</button>
                `;
                list.appendChild(div);
            });
        }

        async function deleteEvent(id) {
            if(confirm('¿Seguro que deseas eliminar este evento?')) {
                await fetch('/api/events/' + id, { method: 'DELETE' });
                fetchEvents();
            }
        }

        document.getElementById('events-form')?.addEventListener('submit', async (e) => {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const res = await fetch('/api/events', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(data)
            });

            if (res.ok) {
                e.target.reset();
                fetchEvents();
                alert('Evento agregado exitosamente');
            } else {
                const err = await res.json();
                alert(err.error || 'Error al agregar el evento');
            }
        });

        async function fetchMessages() {
            const startDate = document.getElementById('filter-start').value;
            const endDate = document.getElementById('filter-end').value;
            let url = '/api/messages?';
            if (startDate) url += `startDate=${startDate}&`;
            if (endDate) url += `endDate=${endDate}`;
            
            const res = await fetch(url);
            const data = await res.json();
            const list = document.getElementById('messages-list');
            list.innerHTML = '';
            
            if (!data.data || data.data.length === 0) {
                list.innerHTML = '<p class="text-on-surface-variant col-span-2">No hay mensajes en este rango de fechas.</p>';
            } else {
                data.data.forEach(item => {
                    const date = new Date(item.created_at).toLocaleString('es-AR');
                    const div = document.createElement('div');
                    div.className = `bg-surface-container-low p-4 rounded-lg rustic-border flex flex-col md:flex-row items-start md:items-center justify-between gap-4 transition-all ${item.is_read ? 'opacity-60 bg-surface-dim' : ''}`;
                    div.innerHTML = `
                        <div class="flex-grow grid grid-cols-1 md:grid-cols-4 gap-4 items-center">
                            <div class="col-span-1">
                                <p class="text-xs text-on-surface-variant mb-1">${date}</p>
                                <h3 class="font-bold text-lg text-primary ${item.is_read ? 'line-through' : ''}">${item.name}</h3>
                                <p class="font-label-sm text-secondary">${item.location}</p>
                            </div>
                            <div class="col-span-3">
                                <p class="font-body-md text-on-surface-variant whitespace-pre-wrap">${item.content}</p>
                            </div>
                        </div>
                        <div class="flex-shrink-0 w-full md:w-auto flex justify-end md:justify-center border-t md:border-t-0 md:border-l border-outline-variant pt-3 md:pt-0 md:pl-4 mt-2 md:mt-0">
                            <label class="flex items-center gap-2 cursor-pointer bg-surface-variant px-3 py-2 rounded-full border border-outline-variant hover:bg-outline-variant transition-colors">
                                <input type="checkbox" ${item.is_read ? 'checked' : ''} onchange="toggleMessageStatus(${item.id}, this.checked)" class="rounded text-secondary focus:ring-secondary w-5 h-5">
                                <span class="font-label-sm text-on-surface-variant">${item.is_read ? 'Cumplido' : 'Cumplir'}</span>
                            </label>
                        </div>
                    `;
                    list.appendChild(div);
                });
            }
        }

        async function toggleMessageStatus(id, isRead) {
            await fetch('/api/messages/' + id + '/read', {
                method: 'PATCH',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ is_read: isRead })
            });
            fetchMessages();
        }

        async function deleteMessages() {
            const startDate = document.getElementById('filter-start').value;
            const endDate = document.getElementById('filter-end').value;
            
            let msg = '¿Seguro que deseas eliminar TODOS los mensajes? Esta acción no se puede deshacer.';
            if (startDate || endDate) {
                msg = '¿Seguro que deseas eliminar los mensajes en el rango de fechas seleccionado?';
            }
            
            if(confirm(msg)) {
                let url = '/api/messages?';
                if (startDate) url += `startDate=${startDate}&`;
                if (endDate) url += `endDate=${endDate}`;
                
                await fetch(url, { method: 'DELETE' });
                fetchMessages();
            }
        }

        fetchNews();
        fetchSettings();
        fetchEvents();
        fetchMessages();
        fetchAds();
        async function forceRssUpdate() {
            if(confirm('¿Forzar la actualización ahora? Esto buscará nuevas noticias y eventos.')) {
                const res = await fetch('/api/cron/rss?force=true');
                const result = await res.json();
                console.log(result.logs);
                alert('Actualización RSS completada.\n' + (result.logs ? result.logs.join('\n') : result.message));
                fetchNews();
                fetchEvents();
            }
        }
    </script>
</body>
</html>
